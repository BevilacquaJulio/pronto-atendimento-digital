services:
  db-test:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_USER: pad
      MYSQL_PASSWORD: pad
      MYSQL_DATABASE: pad_test
      MYSQL_ROOT_PASSWORD: pad
    ports:
      - "127.0.0.1:${PAD_TEST_PORT:-3307}:3306"
    # Banco realmente descartável: os dados vivem somente enquanto este
    # container de teste estiver em execução.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppad"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    mem_limit: 256m
    cpus: 0.5
